[project]
name = "ci-repair"
version = "0.1.0"
description = "Reproduce CI compilation failures and repair them with LLMs (KTH master's thesis)"
requires-python = ">=3.11"
dependencies = ["requests"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ci-repair = "ci_repair.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ci_repair"]
